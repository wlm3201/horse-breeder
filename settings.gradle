pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'horsebreeder'

['26.1.2', '26.2', '26.3'].each { mc ->
    def id = 'v' + mc.replace('.', '_')
    include ":${id}"
    project(":${id}").projectDir = file("versions/${mc}")
}
